name: Pages

# Publishes this repository's one Pages site: the handbook (handbuch/, built
# with VitePress) at its root, and the flasher page under flasher/.
#
# The flasher is the page that writes a factory image onto a brand-new board over
# USB (docs/2026-09-18-factory-image.md). It carries the factory images of the
# last three firmware releases, so it is rebuilt whenever a new release lands -
# and when the page itself changes.
#
# Nothing binary is committed anywhere for this: the images are downloaded from
# the releases here and go straight into the Pages stand, which is not a branch
# and so never reaches a clone. That is what keeps a van's checkout small.
#
# The obvious trigger, `release: published`, cannot be used: such a run happens
# on the tag, and the github-pages environment only lets the default branch
# deploy - the first real release failed exactly there, with "Tag
# fw-2026.09.18.1 is not allowed to deploy to github-pages due to environment
# protection rules", after building perfectly well. What lands on main for every
# release anyway is firmware/manifest.json, which the release tool writes for a
# person to commit, so that commit is the trigger. The images themselves still
# come from the releases, not from that file.

on:
  push:
    branches: [main]
    paths:
      - firmware/manifest.json
      - handbuch/**
      - brand/**
      - flasher/**
      - lib/factory-image.mjs
      - scripts/build-flasher.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: the stand a person is
# downloading an image from should not vanish under them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The handbook shows when each page last changed, which it reads
          # from the history - a shallow clone would date every page today.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect the factory images of the last three releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          kept=0
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
              --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName'); do
            if [ "$kept" -ge 3 ]; then break; fi
            dir="staging/$tag"
            mkdir -p "$dir"
            # Releases from before factory images existed carry none, and are
            # simply passed over - which is why this looks at twenty to find
            # three.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern 'manifest.json' --pattern '*-factory-*.bin' --clobber || true
            if [ -f "$dir/manifest.json" ] && ls "$dir"/*-factory-*.bin >/dev/null 2>&1; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt > "$dir/release.json"
              kept=$((kept + 1))
              echo "staged $tag"
            else
              echo "$tag carries no factory image, skipped"
              rm -rf "$dir"
            fi
          done
          echo "staged $kept release(s)"

      - name: Build the handbook
        # VitePress is the handbook's own dependency (handbuch/package.json),
        # not the designer's, so a van's npm ci never installs it. A dead link
        # fails this build.
        run: |
          npm ci --prefix handbuch
          npm run build --prefix handbuch

      - name: Build the flasher page beside it
        # --install-deps fetches esptool-js and esbuild at the versions the
        # build script pins; --require-bundle makes a page without its flashing
        # code a failed build rather than a quiet disappointment.
        run: node scripts/build-flasher.js --out handbuch/.vitepress/dist/flasher --releases staging --install-deps --require-bundle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: handbuch/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
