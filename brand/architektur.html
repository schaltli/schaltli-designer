<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vom Designer auf die Geräte</title>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* Papier */
      --color-ink:     #111111;   /* Tinte */
      --color-muted:   #555555;   /* Grau */
      --color-accent:  #ff6a13;   /* Signalorange */
      --font-sans:     'Nunito Sans', system-ui, sans-serif;
      --font-title:    'Varela Round', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architektur · Schaltli</p>
    <h1>Vom Designer auf die Geräte</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schaltli-architektur-title schaltli-architektur-desc">
      <title id="schaltli-architektur-title">Vom Designer auf die Geräte</title>
      <desc id="schaltli-architektur-desc">Der Designer im Browser lädt die Oberfläche per HTTP vom Designer-Server auf dem Raspberry Pi und schickt Screens per WebSocket an den MQTT-Broker mosquitto, der sie per MQTT an Knob, Touch-LCD 4.3B, PaperS3, E-Paper-Panel und Android-App verteilt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff6a13"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333333"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="176" y="136" width="448" height="120" rx="8" fill="rgba(17,17,17,0.02)" stroke="rgba(17,17,17,0.12)" stroke-width="0.8"/>
      <rect x="188" y="140" width="132" height="12" rx="2" fill="#ffffff"/>
      <text x="254" y="149" fill="rgba(17,17,17,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RASPBERRY PI · PEKAWAY</text>

      <rect x="28" y="312" width="944" height="112" rx="8" fill="rgba(17,17,17,0.02)" stroke="rgba(17,17,17,0.12)" stroke-width="0.8"/>
      <rect x="40" y="316" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="66" y="325" fill="rgba(17,17,17,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GERÄTE</text>

      <!-- Arrows (before nodes) -->
      <!-- Browser -> Designer-Server -->
      <path d="M468,96 V124 Q468,132 460,132 H288 Q280,132 280,140 V168" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Browser -> mosquitto -->
      <line x1="532" y1="96" x2="532" y2="168" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- mosquitto -> devices, five attach points on the bottom edge -->
      <path d="M432,232 V272 Q432,280 424,280 H140 Q132,280 132,288 V344" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M468,232 V296 Q468,304 460,304 H324 Q316,304 316,312 V344" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="232" x2="500" y2="344" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M532,232 V296 Q532,304 540,304 H676 Q684,304 684,312 V344" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M568,232 V272 Q568,280 576,280 H860 Q868,280 868,288 V344" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px gap to the stroke) -->
      <rect x="352" y="112" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="372" y="121" fill="#888888" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <rect x="540" y="108" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="566" y="117" fill="#888888" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WS :9001</text>

      <rect x="244" y="260" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="276" y="269" fill="#888888" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MQTT :1883</text>

      <!-- Nodes -->
      <!-- Browser (input / user) -->
      <rect x="400" y="40" width="200" height="56" rx="6" fill="#ffffff"/>
      <rect x="400" y="40" width="200" height="56" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="500" y="65" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">Designer</text>
      <text x="500" y="81" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">im Browser</text>

      <!-- Designer-Server (backend) -->
      <rect x="200" y="168" width="160" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="280" y="197" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">Designer-Server</text>
      <text x="280" y="213" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">next start :3000</text>

      <!-- mosquitto (focal) -->
      <rect x="400" y="168" width="200" height="64" rx="6" fill="#ffffff"/>
      <rect x="400" y="168" width="200" height="64" rx="6" fill="rgba(255,106,19,0.10)" stroke="#ff6a13" stroke-width="1.2"/>
      <text x="500" y="197" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">mosquitto</text>
      <text x="500" y="213" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MQTT-Broker · 1883 · ws 9001</text>

      <!-- Devices -->
      <rect x="52" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="132" y="369" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">Knob-Touch 1.8</text>
      <text x="132" y="385" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LCD · 360×360</text>

      <rect x="236" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="316" y="369" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">Touch-LCD 4.3B</text>
      <text x="316" y="385" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LCD · 800×480</text>

      <rect x="420" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="500" y="369" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">PaperS3</text>
      <text x="500" y="385" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">E-Paper 4 Bit · 960×540</text>

      <rect x="604" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="684" y="369" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">GDEY042T81</text>
      <text x="684" y="385" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">E-Paper 1 Bit · 400×300</text>

      <rect x="788" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="868" y="369" fill="#111111" font-size="12" font-weight="600" font-family="'Nunito Sans', sans-serif" text-anchor="middle">Android-App</text>
      <text x="868" y="385" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Telefon</text>

      <!-- Legend strip -->
      <line x1="28" y1="456" x2="972" y2="456" stroke="rgba(17,17,17,0.12)" stroke-width="0.8"/>
      <text x="28" y="480" fill="#555555" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>

      <rect x="120" y="470" width="20" height="14" rx="3" fill="rgba(255,106,19,0.10)" stroke="#ff6a13" stroke-width="1.2"/>
      <text x="148" y="481" fill="#555555" font-size="9" font-family="'Nunito Sans', sans-serif">Drehscheibe: alles läuft über den Broker</text>

      <rect x="360" y="470" width="20" height="14" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1"/>
      <text x="388" y="481" fill="#555555" font-size="9" font-family="'Nunito Sans', sans-serif">Dienst oder Gerät</text>

      <rect x="496" y="470" width="20" height="14" rx="3" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="524" y="481" fill="#555555" font-size="9" font-family="'Nunito Sans', sans-serif">Browser</text>
    </svg>
  </div>
</body>
</html>
