<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="Heute: Browser, Displays und VanPi-Brücke verbinden sich zum Broker im Van. Der Designer holt die Gerätebeschreibung per HTTP direkt vom Display, und das Display holt Projekt und Firmware per HTTP vom Designer.">
      <style>
.zone{fill:#e8eef1;stroke:#c9d2d8}.node{fill:#fff;stroke:#1b2328;stroke-width:1}.node.inner{stroke:#c9d2d8}
.node.new{stroke:#2e8b57;stroke-width:1.5;fill:#e3f2ea}
text{fill:#1b2328;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.name{font-size:15px;font-weight:600}.sub{font-size:12px;fill:#5f6b73}
.tech{font-size:11px;font-family:Consolas,"DejaVu Sans Mono",monospace;fill:#5f6b73}
.zlabel{font-size:10px;font-family:Consolas,monospace;letter-spacing:.08em;fill:#5f6b73}
.lbl{font-size:11.5px;font-family:Consolas,"DejaVu Sans Mono",monospace}
.lbl.mqtt{fill:#1f6f8b}.lbl.http{fill:#a8650a}.lbl.bad{fill:#c0392b}.lbl.muted{fill:#5f6b73}.lbl.accent{fill:#2e8b57;font-weight:500}.lbl.test{fill:#7a4fb5}
.note-bad{font-size:11px;fill:#c0392b}.note-good{font-size:11px;fill:#2e8b57}
.e{fill:none;stroke-width:2}.e.mqtt{stroke:#1f6f8b}.e.http{stroke:#a8650a}.e.bad{stroke:#c0392b;stroke-width:2.5}
.e.muted{stroke:#5f6b73;stroke-width:1.5}.e.accent{stroke:#2e8b57;stroke-width:3}.e.test{stroke:#7a4fb5}.e.design{stroke-dasharray:7 5}
.ah.mqtt{fill:#1f6f8b}.ah.http{fill:#a8650a}.ah.bad{fill:#c0392b}.ah.muted{fill:#5f6b73}.ah.accent{fill:#2e8b57}.ah.test{fill:#7a4fb5}
</style><rect width="980" height="600" fill="#f5f7f8"/><defs>
        <marker id="h-mqtt" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah mqtt" d="M0,0 L10,4 L0,8 z"/></marker>
        <marker id="h-http" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah http" d="M0,0 L10,4 L0,8 z"/></marker>
        <marker id="h-bad" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah bad" d="M0,0 L10,4 L0,8 z"/></marker>
        <marker id="h-muted" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah muted" d="M0,0 L10,4 L0,8 z"/></marker>
        <marker id="h-test" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah test" d="M0,0 L10,4 L0,8 z"/></marker>
      </defs>

      <rect class="zone" x="270" y="20" width="380" height="510" rx="10"/>
      <text class="zlabel" x="286" y="42">RECHNER IM VAN · PI ODER VM</text>

      <rect class="node" x="20" y="40" width="170" height="70" rx="6"/>
      <text class="name" x="105" y="70" text-anchor="middle">Internet</text>
      <text class="sub" x="105" y="90" text-anchor="middle">Icons von Iconify</text>

      <rect class="node" x="20" y="255" width="170" height="90" rx="6"/>
      <text class="name" x="105" y="287" text-anchor="middle">Browser</text>
      <text class="sub" x="105" y="307" text-anchor="middle">Laptop oder Tablet</text>
      <text class="tech" x="105" y="326" text-anchor="middle">gestalten, Vorschau</text>

      <rect class="node" x="300" y="60" width="320" height="110" rx="6"/>
      <text class="name" x="460" y="90" text-anchor="middle">Designer</text>
      <text class="sub" x="460" y="110" text-anchor="middle">speichert Projekte, liefert Dateien aus</text>
      <text class="tech" x="460" y="132" text-anchor="middle">Node.js (Next.js) · HTTP :3000</text>
      <text class="tech" x="460" y="150" text-anchor="middle">auf Pekaway hinter nginx :80</text>

      <rect class="node" x="300" y="250" width="320" height="100" rx="6"/>
      <text class="name" x="460" y="280" text-anchor="middle">MQTT-Broker</text>
      <text class="sub" x="460" y="300" text-anchor="middle">verteilt Werte, Befehle und Aufträge</text>
      <text class="tech" x="460" y="322" text-anchor="middle">Mosquitto · :1883 TCP · :9001 WebSocket</text>
      <text class="note-bad" x="460" y="340" text-anchor="middle">anonym, ohne Passwort</text>

      <rect class="node" x="300" y="430" width="320" height="80" rx="6"/>
      <text class="name" x="460" y="460" text-anchor="middle">VanPi-Brücke</text>
      <text class="sub" x="460" y="479" text-anchor="middle">liest die Pekaway-Anlage</text>
      <text class="tech" x="460" y="497" text-anchor="middle">Node-RED · nur auf Pekaway</text>

      <rect class="node" x="740" y="60" width="220" height="290" rx="6"/>
      <text class="name" x="850" y="88" text-anchor="middle">Displays</text>
      <rect class="node inner" x="758" y="180" width="184" height="62" rx="4"/>
      <text class="name" x="850" y="205" text-anchor="middle" style="font-size:13px">ESP32-Board</text>
      <text class="tech" x="850" y="225" text-anchor="middle">HTTP-Server :80</text>
      <rect class="node inner" x="758" y="256" width="184" height="80" rx="4"/>
      <text class="name" x="850" y="280" text-anchor="middle" style="font-size:13px">Android-App</text>
      <text class="tech" x="850" y="299" text-anchor="middle">HTTP-Server :8080</text>
      <text class="note-bad" x="850" y="320" text-anchor="middle">meldet sich nur über WLAN neu</text>

      <path class="e muted design" d="M105,255 V112" marker-end="url(#h-muted)"/>
      <text class="lbl muted" x="113" y="175">HTTPS · Icons</text>

      <path class="e http design" d="M190,275 H235 V115 H298" marker-end="url(#h-http)"/>
      <text class="lbl http" x="229" y="212" text-anchor="end">HTTP</text>
      <text class="lbl http" x="229" y="226" text-anchor="end">Projekte</text>

      <path class="e mqtt design" d="M190,315 H298" marker-end="url(#h-mqtt)"/>
      <text class="lbl mqtt" x="245" y="307" text-anchor="middle">MQTT/WS</text>

      <path class="e mqtt" d="M460,430 V352" marker-end="url(#h-mqtt)"/>
      <text class="lbl mqtt" x="468" y="396">MQTT</text>

      <path class="e mqtt" d="M740,300 H622" marker-end="url(#h-mqtt)"/>
      <text class="lbl mqtt" x="680" y="292" text-anchor="middle">MQTT :1883</text>

      <path class="e bad design" d="M620,100 H738" marker-end="url(#h-bad)"/>
      <text class="lbl bad" x="680" y="92" text-anchor="middle">GET /ddf.zip</text>

      <path class="e http design" d="M740,145 H622" marker-end="url(#h-http)"/>
      <text class="lbl http" x="680" y="164" text-anchor="middle">GET Projekt,</text>
      <text class="lbl http" x="680" y="178" text-anchor="middle">Firmware</text>

      <rect class="node" x="740" y="400" width="220" height="110" rx="6"/>
      <text class="name" x="850" y="430" text-anchor="middle">Test-PC (HIL)</text>
      <text class="sub" x="850" y="450" text-anchor="middle">npm run test:all</text>
      <text class="tech" x="850" y="470" text-anchor="middle">Orchestratoren in hil/</text>
      <text class="note-bad" x="850" y="492" text-anchor="middle">:80 auch im Van offen</text>

      <path class="e test design" d="M800,400 V352" marker-end="url(#h-test)"/>
      <text class="lbl test" x="794" y="381" text-anchor="end">HTTP :80</text>
      <path class="e test design" d="M900,400 V352" marker-end="url(#h-test)"/>
      <text class="lbl test" x="906" y="381">adb · USB</text>
      <path class="e test design" d="M740,455 H690 V335 H622" marker-end="url(#h-test)"/>
      <text class="lbl test" x="684" y="400" text-anchor="end">MQTT</text>
    <g transform="translate(20,560)">
<line x1="0" y1="0" x2="26" y2="0" stroke="#1f6f8b" stroke-width="2"/><text x="34" y="4" class="lbl mqtt">MQTT</text>
<line x1="100" y1="0" x2="126" y2="0" stroke="#a8650a" stroke-width="2"/><text x="134" y="4" class="lbl http">HTTP</text>
<line x1="200" y1="0" x2="226" y2="0" stroke="#7a4fb5" stroke-width="2"/><text x="234" y="4" class="lbl test">Hardware-Tests</text>
<line x1="370" y1="0" x2="396" y2="0" stroke="#1b2328" stroke-width="2"/><text x="404" y="4" class="lbl">im Betrieb</text>
<line x1="500" y1="0" x2="526" y2="0" stroke="#1b2328" stroke-width="2" stroke-dasharray="7 5"/><text x="534" y="4" class="lbl">nur Gestalten, Übertragen, Testen</text>
<text x="0" y="24" class="lbl muted">Pfeil: vom Teil, das die Verbindung öffnet, zum Teil, das zuhört</text></g></svg>